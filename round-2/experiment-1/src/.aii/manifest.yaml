entries:
  - path: fine_tuned_model_seed42/
    keep: fine-tuned model checkpoint (~90 MB), needed by downstream paper generation
  - path: base_model_weights.pt
    delete: regenerable
    source: "python -c 'from transformers import AutoModel; m=AutoModel.from_pretrained(\"sentence-transformers/all-MiniLM-L6-v2\"); import torch; torch.save(m.state_dict(), \"base_model_weights.pt\")'"
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python torch --extra-index-url https://download.pytorch.org/whl/cpu transformers scikit-learn scipy numpy loguru"
  - path: __pycache__/
    delete: regenerable
    source: "auto-generated by Python on import"
  - path: logs/
    delete: regenerable
    source: "uv run method.py"
